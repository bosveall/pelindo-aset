<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0047AB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="1200" height="300" fill="url(#skyGradient)"/>
  
  <!-- Sea -->
  <rect y="300" width="1200" height="300" fill="url(#seaGradient)"/>
  
  <!-- Sun -->
  <circle cx="1100" cy="80" r="40" fill="#FFD700" opacity="0.9"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="80" rx="60" ry="30" fill="white" opacity="0.7"/>
  <ellipse cx="200" cy="90" rx="50" ry="25" fill="white" opacity="0.7"/>
  
  <ellipse cx="900" cy="120" rx="70" ry="35" fill="white" opacity="0.6"/>
  <ellipse cx="960" cy="135" rx="55" ry="28" fill="white" opacity="0.6"/>
  
  <!-- Dock/Pier -->
  <rect x="0" y="280" width="1200" height="40" fill="#8B7355"/>
  <rect x="0" y="320" width="1200" height="15" fill="#A0826D"/>
  
  <!-- Dock posts -->
  <rect x="100" y="250" width="15" height="90" fill="#654321"/>
  <rect x="300" y="260" width="15" height="80" fill="#654321"/>
  <rect x="500" y="255" width="15" height="85" fill="#654321"/>
  <rect x="700" y="265" width="15" height="75" fill="#654321"/>
  <rect x="900" y="260" width="15" height="80" fill="#654321"/>
  <rect x="1100" y="270" width="15" height="70" fill="#654321"/>
  
  <!-- Large cargo ship in center -->
  <g id="ship1">
    <!-- Ship hull -->
    <path d="M 300 400 L 250 450 L 550 450 L 500 400 Z" fill="#DC143C" stroke="#8B0000" stroke-width="2"/>
    <!-- Ship deck -->
    <rect x="260" y="390" width="280" height="15" fill="#DC143C"/>
    <!-- Container stacks -->
    <rect x="280" y="320" width="40" height="70" fill="#1E90FF" stroke="black" stroke-width="1"/>
    <rect x="330" y="330" width="40" height="60" fill="#32CD32" stroke="black" stroke-width="1"/>
    <rect x="380" y="325" width="40" height="65" fill="#FFD700" stroke="black" stroke-width="1"/>
    <rect x="430" y="335" width="40" height="55" fill="#FF6347" stroke="black" stroke-width="1"/>
    <!-- Cabin -->
    <rect x="340" y="280" width="80" height="50" fill="#2F4F4F" stroke="black" stroke-width="1"/>
    <rect x="355" y="295" width="15" height="15" fill="#87CEEB"/>
    <rect x="395" y="295" width="15" height="15" fill="#87CEEB"/>
    <!-- Smokestacks -->
    <rect x="365" y="230" width="15" height="50" fill="#4A4A4A"/>
    <rect x="405" y="240" width="15" height="40" fill="#4A4A4A"/>
    <!-- Smoke -->
    <circle cx="372" cy="220" r="8" fill="#A9A9A9" opacity="0.6"/>
    <circle cx="412" cy="230" r="8" fill="#A9A9A9" opacity="0.6"/>
  </g>
  
  <!-- Medium cargo ship on left -->
  <g id="ship2">
    <!-- Ship hull -->
    <path d="M 100 430 L 60 470 L 280 470 L 250 430 Z" fill="#DC143C" stroke="#8B0000" stroke-width="2"/>
    <!-- Ship deck -->
    <rect x="65" y="420" width="200" height="12" fill="#DC143C"/>
    <!-- Containers -->
    <rect x="80" y="365" width="30" height="55" fill="#FF6347" stroke="black" stroke-width="1"/>
    <rect x="120" y="375" width="30" height="45" fill="#1E90FF" stroke="black" stroke-width="1"/>
    <rect x="160" y="370" width="30" height="50" fill="#32CD32" stroke="black" stroke-width="1"/>
    <!-- Cabin -->
    <rect x="120" y="330" width="60" height="40" fill="#2F4F4F" stroke="black" stroke-width="1"/>
    <rect x="132" y="342" width="12" height="12" fill="#87CEEB"/>
    <!-- Smokestack -->
    <rect x="138" y="290" width="12" height="40" fill="#4A4A4A"/>
    <!-- Anchor chain -->
    <line x1="150" y1="470" x2="150" y2="500" stroke="#696969" stroke-width="2"/>
  </g>
  
  <!-- Small tugboat -->
  <g id="boat3">
    <!-- Hull -->
    <path d="M 850 460 L 830 490 L 920 490 L 900 460 Z" fill="#FF8C00" stroke="#FF4500" stroke-width="2"/>
    <!-- Cabin -->
    <rect x="860" y="420" width="40" height="45" fill="#2F4F4F" stroke="black" stroke-width="1"/>
    <!-- Window -->
    <rect x="868" y="432" width="10" height="10" fill="#87CEEB"/>
    <!-- Smokestack -->
    <rect x="873" y="395" width="8" height="25" fill="#4A4A4A"/>
    <!-- Rope -->
    <line x1="875" y1="490" x2="875" y2="520" stroke="#8B4513" stroke-width="1"/>
  </g>
  
  <!-- Cargo ship on right -->
  <g id="ship4">
    <!-- Ship hull -->
    <path d="M 950 410 L 900 460 L 1150 460 L 1100 410 Z" fill="#DC143C" stroke="#8B0000" stroke-width="2"/>
    <!-- Ship deck -->
    <rect x="910" y="400" width="230" height="15" fill="#DC143C"/>
    <!-- Containers -->
    <rect x="930" y="330" width="35" height="70" fill="#32CD32" stroke="black" stroke-width="1"/>
    <rect x="975" y="340" width="35" height="60" fill="#1E90FF" stroke="black" stroke-width="1"/>
    <rect x="1020" y="335" width="35" height="65" fill="#FFD700" stroke="black" stroke-width="1"/>
    <!-- Cabin -->
    <rect x="980" y="275" width="75" height="50" fill="#2F4F4F" stroke="black" stroke-width="1"/>
    <rect x="993" y="290" width="12" height="12" fill="#87CEEB"/>
    <rect x="1035" y="290" width="12" height="12" fill="#87CEEB"/>
    <!-- Smokestacks -->
    <rect x="1000" y="220" width="12" height="55" fill="#4A4A4A"/>
    <rect x="1038" y="235" width="12" height="40" fill="#4A4A4A"/>
  </g>
  
  <!-- Harbor crane on left -->
  <g id="crane1">
    <!-- Post -->
    <rect x="40" y="200" width="20" height="200" fill="#696969"/>
    <!-- Arm -->
    <rect x="50" y="200" width="200" height="15" fill="#696969" transform="rotate(-15 150 207)"/>
    <!-- Cable -->
    <line x1="240" y1="190" x2="240" y2="300" stroke="#C0C0C0" stroke-width="2"/>
  </g>
  
  <!-- Harbor crane on right -->
  <g id="crane2">
    <!-- Post -->
    <rect x="1140" y="210" width="20" height="190" fill="#696969"/>
    <!-- Arm -->
    <rect x="960" y="210" width="200" height="15" fill="#696969" transform="rotate(15 1060 217)"/>
    <!-- Cable -->
    <line x1="960" y1="200" x2="960" y2="310" stroke="#C0C0C0" stroke-width="2"/>
  </g>
  
  <!-- Water waves -->
  <path d="M 0 500 Q 75 495 150 500 T 300 500 T 450 500 T 600 500 T 750 500 T 900 500 T 1050 500 T 1200 500" 
        stroke="#0047AB" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 0 520 Q 75 515 150 520 T 300 520 T 450 520 T 600 520 T 750 520 T 900 520 T 1050 520 T 1200 520" 
        stroke="#0047AB" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Seagulls -->
  <g id="bird1">
    <path d="M 300 150 Q 310 140 320 150" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 290 150 Q 300 140 310 150" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="305" cy="152" r="2" fill="#333"/>
  </g>
  
  <g id="bird2" transform="translate(600, 100)">
    <path d="M 300 150 Q 310 140 320 150" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 290 150 Q 300 140 310 150" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="305" cy="152" r="2" fill="#333"/>
  </g>
</svg>
